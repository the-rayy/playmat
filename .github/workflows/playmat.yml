name: playmat

on:
  push:
    paths:
      - crates/**
      - games/**
      - Cargo.toml
      - Cargo.lock
      - .github/workflows/playmat.yml

jobs:
  test:
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install just
        uses: extractions/setup-just@v4

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          target: wasm32-unknown-unknown

      - name: Lint
        run: just lint

      - name: Test
        run: just test
      
  build:
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install just
        uses: extractions/setup-just@v4

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          target: wasm32-unknown-unknown

      - name: Build client
        run: just build
